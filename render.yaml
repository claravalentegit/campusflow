# One-click hosting on Render (render.com): New → Blueprint → pick this repository.
services:
  - type: web
    name: campusflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Sessions live in an encrypted HttpOnly cookie, so a restart (free servers sleep) doesn't sign anyone out.
      - key: SESSION_STORE
        value: cookie
      - key: SESSION_SECRET
        generateValue: true
      # Render's proxy adds the visitor's address; use it for rate limiting.
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      # Only allow sign-in to these Canvas hosts (comma-separated, *.wildcards allowed).
      - key: CANVAS_ALLOWED_HOSTS
        value: ocps.instructure.com

  # Study Room: a separate app in studyroom/ (live study rooms with pixel characters).
  - type: web
    name: study-room
    runtime: node
    plan: free
    rootDir: studyroom
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
